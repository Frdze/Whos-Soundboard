<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Soundboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;600&family=Manrope:wght@400;600;700&family=Playfair+Display:wght@600;700&family=Rubik:wght@400;600;700&family=Sora:wght@400;600;700&family=Space+Grotesk:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      const API_BASE = (() => {
        const origin = window.location.origin || '';
        return origin.startsWith('http://') || origin.startsWith('https://')
          ? origin
          : 'http://127.0.0.1:5000';
      })();
    </script>
    <style>
      :root {
        color-scheme: light;
        --bg: #f8f6f1;
        --panel: #ffffff;
        --panel-soft: #f2eee6;
        --ink: #171717;
        --ink-muted: #5b544a;
        --accent: #d6281d;
        --accent-dark: #b1130c;
        --accent-shadow: #7a0b07;
        --border: #c9c1b2;
        --shadow: 0 8px 18px rgba(0, 0, 0, 0.12);
        --pattern-dot: rgba(0, 0, 0, 0.04);
        --pattern-opacity: 0.22;
        --font-body: 'Manrope', 'Segoe UI', sans-serif;
        --font-display: 'Playfair Display', 'Manrope', serif;
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        height: 100%;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--font-body);
        overflow: hidden;
      }

      body::before {
        content: '';
        position: fixed;
        inset: 0;
        background-image: radial-gradient(circle at 1px 1px, var(--pattern-dot) 1px, transparent 0);
        background-size: 18px 18px;
        opacity: var(--pattern-opacity);
        pointer-events: none;
      }

      .hidden {
        display: none !important;
      }

      .mi-shell {
        height: 100vh;
        min-height: 100%;
        display: flex;
        flex-direction: column;
        gap: 16px;
        padding: 16px;
        position: relative;
        z-index: 1;
      }

      .mi-header {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 12px 16px;
        box-shadow: var(--shadow);
      }

      .mi-titlebar {
        display: flex;
        align-items: center;
        gap: 12px;
        -webkit-app-region: drag;
      }

      button, input, select, .sound-card, .library-card {
        -webkit-app-region: no-drag;
      }

      .mi-titlebar .controls {
        display: flex;
        gap: 8px;
        -webkit-app-region: no-drag;
      }

      .titlebar-button {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        border: none;
        box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.2);
      }

      .btn-close { background: #ff5f57; }
      .btn-min { background: #ffbd2e; }
      .btn-max { background: #28c840; }

      .mi-brand {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .mi-logo {
        width: 32px;
        height: 32px;
      }

      .mi-brand-text {
        font-family: var(--font-display);
        font-size: 22px;
        letter-spacing: 0.4px;
      }

      .mi-status {
        margin-left: auto;
        font-size: 12px;
        color: var(--ink-muted);
        -webkit-app-region: no-drag;
      }

      .mi-search {
        margin-top: 12px;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
      }

      .mi-search input {
        flex: 1;
        min-width: 240px;
        padding: 12px 18px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--ink);
        font-size: 15px;
        box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.06);
      }

      .mi-search input::placeholder {
        color: var(--ink-muted);
      }

      .mi-search input:focus {
        outline: 2px solid rgba(214, 40, 29, 0.25);
        border-color: var(--accent);
      }

      .mi-button {
        padding: 10px 18px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--panel-soft);
        color: var(--ink);
        font-weight: 600;
        cursor: pointer;
      }

      .mi-button--primary {
        background: var(--accent);
        color: #ffffff;
        border-color: var(--accent-dark);
        box-shadow: 0 4px 0 var(--accent-shadow);
      }

      .mi-button--primary:active {
        transform: translateY(2px);
        box-shadow: 0 2px 0 var(--accent-shadow);
      }

      .mi-button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .mi-nav {
        margin-top: 12px;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }

      .mi-pill {
        padding: 8px 14px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--panel);
        font-weight: 600;
        cursor: pointer;
      }

      .tab-active {
        background: var(--accent);
        color: #ffffff;
        border-color: var(--accent-dark);
        box-shadow: 0 3px 0 var(--accent-shadow);
      }

      .tab-inactive {
        color: var(--ink-muted);
        background: var(--panel-soft);
      }

      .mi-select {
        padding: 8px 12px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--panel);
        font-weight: 600;
        color: var(--ink);
      }

      .mi-badge {
        padding: 6px 10px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--panel-soft);
        font-size: 12px;
        font-weight: 700;
      }

      .mi-nav-right {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-left: auto;
        flex-wrap: wrap;
      }

      .mi-main {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 280px;
        gap: 16px;
      }

      .mi-panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 16px;
        box-shadow: var(--shadow);
      }

      .mi-results {
        display: flex;
        flex-direction: column;
        min-height: 0;
      }

      .mi-results-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }

      .mi-results-title {
        font-family: var(--font-display);
        font-size: 18px;
      }

      .mi-count {
        padding: 6px 12px;
        border-radius: 999px;
        background: var(--panel-soft);
        border: 1px solid var(--border);
        font-size: 12px;
        font-weight: 600;
        color: var(--ink-muted);
      }

      .mi-grid-scroll {
        min-height: 0;
        flex: 1;
        overflow: auto;
        padding-right: 6px;
      }

      .mi-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 18px;
      }

      .mi-grid--library {
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      }

      .sound-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        text-align: center;
        padding: 6px;
        cursor: pointer;
      }

      .sound-card-actions {
        margin-top: 6px;
      }

      .instant-button {
        width: 86px;
        height: 86px;
        border-radius: 50%;
        border: none;
        cursor: pointer;
        position: relative;
        background: radial-gradient(circle at 30% 30%, #ff8f84 0%, var(--accent) 55%, #9d100a 100%);
        box-shadow: 0 6px 0 var(--accent-shadow), 0 12px 16px rgba(0, 0, 0, 0.25);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .instant-button .playIcon,
      .instant-button .libraryPlayIcon {
        display: none;
      }

      .instant-button:active {
        transform: translateY(4px);
        box-shadow: 0 2px 0 var(--accent-shadow), 0 6px 10px rgba(0, 0, 0, 0.35);
      }

      .instant-button--small {
        width: 64px;
        height: 64px;
      }

      .playIcon svg,
      .libraryPlayIcon svg {
        width: 26px;
        height: 26px;
        color: #ffffff;
        filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.3));
      }

      .sound-title {
        font-size: 13px;
        font-weight: 700;
        max-width: 120px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        font-family: var(--font-display);
      }

      .sound-meta {
        font-size: 11px;
        color: var(--ink-muted);
      }

      .mi-download {
        background: var(--panel);
        border-color: var(--border);
        font-size: 10px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        padding: 6px 12px;
      }

      .mi-empty {
        margin-top: 20px;
        border: 2px dashed var(--border);
        border-radius: 14px;
        padding: 28px;
        text-align: center;
        color: var(--ink-muted);
        background: var(--panel-soft);
      }

      .mi-side {
        display: flex;
        flex-direction: column;
        gap: 16px;
        min-height: 0;
      }

      .mi-card-title {
        font-family: var(--font-display);
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.2em;
        color: var(--ink-muted);
      }

      .mi-now-title {
        font-weight: 700;
        margin-top: 10px;
      }

      .mi-icon-button {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: var(--panel-soft);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }

      .mi-icon-button--ghost {
        width: 40px;
        height: 40px;
        border-radius: 12px;
        background: var(--panel);
      }

      .mi-settings-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      .mi-settings-button svg {
        width: 18px;
        height: 18px;
        color: var(--ink);
      }

      .mi-modal {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.35);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 20;
        padding: 20px;
      }

      .mi-modal-card {
        width: min(640px, 94vw);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 18px;
        box-shadow: var(--shadow);
      }

      .mi-modal-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .mi-modal-title {
        font-family: var(--font-display);
        font-size: 20px;
      }

      .mi-modal-body {
        margin-top: 14px;
        display: grid;
        gap: 16px;
      }

      .mi-section-title {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.2em;
        color: var(--ink-muted);
      }

      .theme-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 12px;
      }

      .theme-card {
        padding: 12px;
        border-radius: 14px;
        border: 1px solid var(--border);
        background: var(--panel-soft);
        text-align: left;
        cursor: pointer;
        display: grid;
        gap: 8px;
      }

      .theme-card.active {
        border-color: var(--accent);
        box-shadow: 0 0 0 2px var(--accent);
      }

      .theme-swatch {
        height: 36px;
        border-radius: 10px;
        border: 1px solid rgba(0, 0, 0, 0.08);
      }

      .theme-name {
        font-weight: 700;
      }

      .theme-font {
        font-size: 11px;
        color: var(--ink-muted);
      }

      .theme-card[data-theme="dark"] .theme-swatch {
        background: linear-gradient(135deg, #0f0f0f, #2b2b2b);
      }

      .theme-card[data-theme="terminal"] .theme-swatch {
        background: linear-gradient(135deg, #0b1116, #13301f);
      }

      .theme-card[data-theme="light-modern"] .theme-swatch {
        background: linear-gradient(135deg, #f6f4ee, #ffffff);
      }

      .theme-card[data-theme="dark-blue"] .theme-swatch {
        background: linear-gradient(135deg, #0b1220, #1b2d4f);
      }

      .theme-card[data-theme="redmode"] .theme-swatch {
        background: linear-gradient(135deg, #1a0b0b, #401313);
      }

      .mi-range {
        width: 100%;
        accent-color: var(--accent);
      }

      .library-card {
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: var(--panel-soft);
      }

      .library-row {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .library-info {
        flex: 1;
        min-width: 0;
      }

      .libraryTitle {
        font-weight: 700;
      }

      .libraryMeta {
        font-size: 11px;
        color: var(--ink-muted);
      }

      .libraryDeleteButton {
        padding: 6px 10px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--panel);
        cursor: pointer;
        font-size: 12px;
      }

      .library-shortcut {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: flex-end;
      }

      .shortcutInput {
        width: 160px;
        padding: 8px 10px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--ink);
      }

      .shortcut-label {
        display: block;
        font-size: 10px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--ink-muted);
        margin-bottom: 6px;
      }

      .library-actions {
        display: flex;
        gap: 8px;
      }

      .libraryStatus {
        font-size: 11px;
        color: var(--ink-muted);
      }

      .shortcut-capture {
        border-color: var(--accent);
        box-shadow: 0 0 0 2px rgba(214, 40, 29, 0.25);
      }

      @media (max-width: 960px) {
        .mi-main {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 640px) {
        .instant-button {
          width: 74px;
          height: 74px;
        }

        .instant-button--small {
          width: 56px;
          height: 56px;
        }
      }
    </style>
  </head>
  <body>
    <div class="mi-shell">
      <header class="mi-header">
        <div class="mi-titlebar">
          <div class="controls">
            <button id="winClose" class="titlebar-button btn-close" aria-label="Close"></button>
            <button id="winMin" class="titlebar-button btn-min" aria-label="Minimize"></button>
            <button id="winMax" class="titlebar-button btn-max" aria-label="Maximize"></button>
          </div>

          <div class="mi-brand">
            <img src="icon.png" alt="Soundboard" class="mi-logo" />
            <div class="mi-brand-text">Soundboard</div>
          </div>

          <div id="statusLabel" class="mi-status">Idle</div>
        </div>

        <div class="mi-search">
          <input id="searchInput" type="text" placeholder="Search Myinstants..." />
          <button id="searchButton" class="mi-button mi-button--primary">Search</button>
          <button id="trendingButton" class="mi-button">Trending</button>
        </div>

        <div class="mi-nav">
          <button id="tab-search" class="mi-pill tab-active">Search</button>
          <button id="tab-library" class="mi-pill tab-inactive">Library</button>

          <select id="categorySelect" class="mi-select">
            <option value="">Categories</option>
          </select>

          <div class="mi-nav-right">
            <div id="countryBadge" class="mi-badge">--</div>
            <select id="audioOutput" class="mi-select">
              <option value="">Default output</option>
            </select>
            <button id="refreshDevicesButton" class="mi-button">Refresh</button>
            <button id="settingsButton" class="mi-icon-button mi-icon-button--ghost mi-settings-button" type="button" aria-label="Open settings">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="3.2"></circle>
                <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1A2 2 0 1 1 7 3.1l.1.1a1.7 1.7 0 0 0 1.9.3h0A1.7 1.7 0 0 0 10 2V2a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5h0a1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9v0a1.7 1.7 0 0 0 1.5 1H22a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path>
              </svg>
            </button>
          </div>
        </div>
      </header>

      <div class="mi-main">
        <main class="mi-panel mi-results">
          <div class="mi-results-header">
            <div id="resultsTitle" class="mi-results-title">Search results</div>
            <div id="resultsCount" class="mi-count">0 results</div>
          </div>

          <div id="searchView" class="mi-grid-scroll">
            <div id="resultsGrid" class="mi-grid"></div>
            <div id="emptyState" class="mi-empty">Search a sound to show results.</div>
          </div>

          <div id="libraryView" class="mi-grid-scroll hidden">
            <div id="libraryGrid" class="mi-grid mi-grid--library"></div>
            <div id="libraryEmpty" class="mi-empty">Library is empty.</div>
          </div>
        </main>

        <aside class="mi-side">
          <section class="mi-panel">
            <div class="mi-card-title">Now Playing</div>
            <div id="nowPlayingTitle" class="mi-now-title">No sound loaded</div>
            <div id="nowPlayingMeta" class="sound-meta">Select a sound to preview.</div>

            <div style="margin-top: 12px; display: flex; align-items: center; gap: 12px;">
              <button id="playPauseButton" class="mi-icon-button" disabled>
                <span id="playPauseIcon" aria-hidden="true"></span>
              </button>
              <div style="flex: 1;">
                <div style="display: flex; align-items: center; justify-content: space-between; font-size: 11px; color: var(--ink-muted); margin-bottom: 6px;">
                  <span>Volume</span>
                  <span id="volumeValue">85%</span>
                </div>
                <input id="volumeSlider" type="range" min="0" max="100" value="85" class="mi-range" />
              </div>
            </div>
            <audio id="audioPlayer" preload="none"></audio>
          </section>

          <section class="mi-panel">
            <div class="mi-card-title">Shortcuts</div>
            <div id="shortcutStatus" class="sound-meta" style="margin-top: 8px;">No shortcut events yet.</div>
          </section>
        </aside>
      </div>
    </div>

    <div id="settingsModal" class="mi-modal hidden" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <div class="mi-modal-card">
        <div class="mi-modal-header">
          <div id="settingsTitle" class="mi-modal-title">Settings</div>
          <button id="settingsClose" class="mi-icon-button mi-icon-button--ghost" type="button" aria-label="Close settings">✕</button>
        </div>
        <div class="mi-modal-body">
          <div>
            <div class="mi-section-title">Theme</div>
            <div id="themeGrid" class="theme-grid">
              <button class="theme-card" data-theme="dark" type="button">
                <div class="theme-swatch"></div>
                <div class="theme-name">Dark</div>
                <div class="theme-font">Sora</div>
              </button>
              <button class="theme-card" data-theme="terminal" type="button">
                <div class="theme-swatch"></div>
                <div class="theme-name">Terminal</div>
                <div class="theme-font">IBM Plex Mono</div>
              </button>
              <button class="theme-card" data-theme="light-modern" type="button">
                <div class="theme-swatch"></div>
                <div class="theme-name">Light Modern</div>
                <div class="theme-font">Manrope + Playfair</div>
              </button>
              <button class="theme-card" data-theme="dark-blue" type="button">
                <div class="theme-swatch"></div>
                <div class="theme-name">Dark Blue</div>
                <div class="theme-font">Space Grotesk</div>
              </button>
              <button class="theme-card" data-theme="redmode" type="button">
                <div class="theme-swatch"></div>
                <div class="theme-name">Redmode</div>
                <div class="theme-font">Bebas Neue + Rubik</div>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <template id="soundCardTemplate">
      <div class="sound-card">
        <button class="instant-button" type="button" aria-label="Play sound">
          <span class="playIcon" aria-hidden="true"></span>
        </button>
        <div class="sound-title title">Sound title</div>
        <div class="sound-meta meta">Preview ready</div>
      </div>
    </template>

    <template id="libraryCardTemplate">
      <div class="library-card">
        <div class="library-row">
          <button class="libraryPlayButton instant-button instant-button--small" type="button">
            <span class="libraryPlayIcon" aria-hidden="true"></span>
          </button>
          <div class="library-info">
            <div class="libraryTitle">Saved sound</div>
            <div class="libraryMeta">Local file</div>
          </div>
          <button class="libraryDeleteButton" type="button">Remove</button>
        </div>
        <div class="library-shortcut">
          <label>
            <span class="shortcut-label">Shortcut</span>
            <input class="shortcutInput" placeholder="Ctrl+Alt+1" />
          </label>
          <div class="library-actions">
            <button class="recordShortcutButton mi-button" type="button">Record</button>
            <button class="registerShortcutButton mi-button mi-button--primary" type="button">Save</button>
          </div>
        </div>
        <div class="libraryStatus">No shortcut registered.</div>
      </div>
    </template>

    <script>
      const state = {
        currentSound: null,
        countryCode: 'id',
        categories: [],
        library: JSON.parse(localStorage.getItem('soundboard-library') || '[]').map((item) => ({
          ...item,
          id: item.id || item.mp3_url || item.localPath,
          shortcut: item.shortcut || '',
        })),
        selectedSinkId: '',
        isPlaying: false,
        activeTab: 'search',
        shortcutCapture: null,
      };

      const ICONS = {
        play: `
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M8 5.5v13l11-6.5-11-6.5z"></path>
          </svg>
        `,
        pause: `
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M7 5h3v14H7zM14 5h3v14h-3z"></path>
          </svg>
        `,
      };

      const THEME_STORAGE_KEY = 'soundboard-theme';

      const THEMES = {
        dark: {
          label: 'Dark',
          colorScheme: 'dark',
          fonts: {
            body: "'Sora', sans-serif",
            display: "'Sora', sans-serif",
          },
          vars: {
            '--bg': '#0b0b0b',
            '--panel': '#151515',
            '--panel-soft': '#1e1e1e',
            '--ink': '#f8f8f8',
            '--ink-muted': '#d0d0d0',
            '--accent': '#ff5a5a',
            '--accent-dark': '#e64242',
            '--accent-shadow': '#8f1f1f',
            '--border': '#2e2e2e',
            '--shadow': '0 8px 18px rgba(0, 0, 0, 0.55)',
            '--pattern-dot': 'rgba(255, 255, 255, 0.07)',
            '--pattern-opacity': '0.14',
          },
        },
        terminal: {
          label: 'Terminal',
          colorScheme: 'dark',
          fonts: {
            body: "'IBM Plex Mono', monospace",
            display: "'IBM Plex Mono', monospace",
          },
          vars: {
            '--bg': '#0b0f0c',
            '--panel': '#111815',
            '--panel-soft': '#141f1a',
            '--ink': '#eaffea',
            '--ink-muted': '#b7d6b7',
            '--accent': '#20ff87',
            '--accent-dark': '#00c46a',
            '--accent-shadow': '#007346',
            '--border': '#1e2b25',
            '--shadow': '0 8px 18px rgba(0, 0, 0, 0.6)',
            '--pattern-dot': 'rgba(255, 255, 255, 0.06)',
            '--pattern-opacity': '0.12',
          },
        },
        'light-modern': {
          label: 'Light Modern',
          colorScheme: 'light',
          fonts: {
            body: "'Manrope', sans-serif",
            display: "'Playfair Display', serif",
          },
          vars: {
            '--bg': '#f8f6f1',
            '--panel': '#ffffff',
            '--panel-soft': '#f2eee6',
            '--ink': '#171717',
            '--ink-muted': '#5b544a',
            '--accent': '#d6281d',
            '--accent-dark': '#b1130c',
            '--accent-shadow': '#7a0b07',
            '--border': '#c9c1b2',
            '--shadow': '0 8px 18px rgba(0, 0, 0, 0.12)',
            '--pattern-dot': 'rgba(0, 0, 0, 0.04)',
            '--pattern-opacity': '0.22',
          },
        },
        'dark-blue': {
          label: 'Dark Blue',
          colorScheme: 'dark',
          fonts: {
            body: "'Space Grotesk', sans-serif",
            display: "'Space Grotesk', sans-serif",
          },
          vars: {
            '--bg': '#08101c',
            '--panel': '#0f1a2f',
            '--panel-soft': '#15233d',
            '--ink': '#f2f6ff',
            '--ink-muted': '#c2d0ea',
            '--accent': '#4da3ff',
            '--accent-dark': '#2f7ee6',
            '--accent-shadow': '#0b3a7a',
            '--border': '#20304f',
            '--shadow': '0 8px 18px rgba(0, 0, 0, 0.6)',
            '--pattern-dot': 'rgba(255, 255, 255, 0.07)',
            '--pattern-opacity': '0.14',
          },
        },
        redmode: {
          label: 'Redmode',
          colorScheme: 'dark',
          fonts: {
            body: "'Rubik', sans-serif",
            display: "'Bebas Neue', sans-serif",
          },
          vars: {
            '--bg': '#140707',
            '--panel': '#1e0b0b',
            '--panel-soft': '#2a1010',
            '--ink': '#fff0ee',
            '--ink-muted': '#f1c0bb',
            '--accent': '#ff3b3b',
            '--accent-dark': '#d61f1f',
            '--accent-shadow': '#7a0f0f',
            '--border': '#3a1a1a',
            '--shadow': '0 8px 18px rgba(0, 0, 0, 0.6)',
            '--pattern-dot': 'rgba(255, 255, 255, 0.08)',
            '--pattern-opacity': '0.12',
          },
        },
      };

      const el = {
        tabSearch: document.getElementById('tab-search'),
        tabLibrary: document.getElementById('tab-library'),
        searchInput: document.getElementById('searchInput'),
        searchButton: document.getElementById('searchButton'),
        refreshDevicesButton: document.getElementById('refreshDevicesButton'),
        audioOutput: document.getElementById('audioOutput'),
        resultsGrid: document.getElementById('resultsGrid'),
        resultsCount: document.getElementById('resultsCount'),
        resultsTitle: document.getElementById('resultsTitle'),
        emptyState: document.getElementById('emptyState'),
        searchView: document.getElementById('searchView'),
        libraryView: document.getElementById('libraryView'),
        libraryGrid: document.getElementById('libraryGrid'),
        libraryEmpty: document.getElementById('libraryEmpty'),
        nowPlayingTitle: document.getElementById('nowPlayingTitle'),
        nowPlayingMeta: document.getElementById('nowPlayingMeta'),
        playPauseButton: document.getElementById('playPauseButton'),
        playPauseIcon: document.getElementById('playPauseIcon'),
        audioPlayer: document.getElementById('audioPlayer'),
        volumeSlider: document.getElementById('volumeSlider'),
        volumeValue: document.getElementById('volumeValue'),
        statusLabel: document.getElementById('statusLabel'),
        trendingButton: document.getElementById('trendingButton'),
        categorySelect: document.getElementById('categorySelect'),
        countryBadge: document.getElementById('countryBadge'),
        winClose: document.getElementById('winClose'),
        winMin: document.getElementById('winMin'),
        winMax: document.getElementById('winMax'),
        shortcutStatus: document.getElementById('shortcutStatus'),
        settingsButton: document.getElementById('settingsButton'),
        settingsModal: document.getElementById('settingsModal'),
        settingsClose: document.getElementById('settingsClose'),
        themeButtons: Array.from(document.querySelectorAll('.theme-card')),
      };

      function setStatus(message) {
        el.statusLabel.textContent = message;
      }

      function setPlaying(isPlaying) {
        state.isPlaying = isPlaying;
        el.playPauseIcon.innerHTML = isPlaying ? ICONS.pause : ICONS.play;
      }

      function setActiveTab(tab) {
        state.activeTab = tab;
        const activeClasses = ['tab-active'];
        const inactiveClasses = ['tab-inactive'];

        [el.tabSearch, el.tabLibrary].forEach((button) => {
          button.classList.remove(...activeClasses, ...inactiveClasses);
        });

        if (tab === 'search') {
          el.tabSearch.classList.add(...activeClasses);
          el.tabLibrary.classList.add(...inactiveClasses);
          el.searchView.classList.remove('hidden');
          el.libraryView.classList.add('hidden');
        } else {
          el.tabLibrary.classList.add(...activeClasses);
          el.tabSearch.classList.add(...inactiveClasses);
          el.libraryView.classList.remove('hidden');
          el.searchView.classList.add('hidden');
        }
      }

      function updateThemeSelection(activeKey) {
        if (!el.themeButtons) return;

        el.themeButtons.forEach((button) => {
          const isActive = button.dataset.theme === activeKey;
          button.classList.toggle('active', isActive);
        });
      }

      function applyTheme(themeKey) {
        const resolvedKey = THEMES[themeKey] ? themeKey : 'light-modern';
        const theme = THEMES[resolvedKey];
        const root = document.documentElement;

        Object.entries(theme.vars).forEach(([key, value]) => {
          root.style.setProperty(key, value);
        });

        root.style.setProperty('--font-body', theme.fonts.body);
        root.style.setProperty('--font-display', theme.fonts.display);
        root.style.colorScheme = theme.colorScheme || 'light';

        root.dataset.theme = resolvedKey;
        localStorage.setItem(THEME_STORAGE_KEY, resolvedKey);
        updateThemeSelection(resolvedKey);
      }

      function openSettings() {
        if (!el.settingsModal) return;
        el.settingsModal.classList.remove('hidden');
      }

      function closeSettings() {
        if (!el.settingsModal) return;
        el.settingsModal.classList.add('hidden');
      }

      function saveLibrary() {
        localStorage.setItem('soundboard-library', JSON.stringify(state.library));
      }

      function getSoundId(sound) {
        return sound.id || sound.mp3_url || sound.localPath;
      }

      function toFileUrl(filePath) {
        return encodeURI(`file:///${String(filePath).replace(/\\/g, '/')}`);
      }

      function getSoundSource(sound) {
        return sound.localPath ? toFileUrl(sound.localPath) : sound.mp3_url;
      }

      function normalizeSound(sound) {
        return {
          id: getSoundId(sound),
          name: sound.name || 'Untitled sound',
          mp3_url: sound.mp3_url || '',
          localPath: sound.localPath || '',
          shortcut: sound.shortcut || '',
          downloadedAt: sound.downloadedAt || Date.now(),
        };
      }

      function formatAcceleratorFromEvent(event) {
        const parts = [];
        const keyName = getKeyNameFromEvent(event);

        if (!keyName) {
          return '';
        }

        if (event.ctrlKey) parts.push('Ctrl');
        if (event.metaKey) parts.push('Meta');
        if (event.altKey) parts.push('Alt');
        if (event.shiftKey) parts.push('Shift');

        parts.push(keyName);

        return parts.join('+');
      }

      function getKeyNameFromEvent(event) {
        const code = String(event.code || '');
        const key = String(event.key || '');
        const normalizedKey = key.toLowerCase();

        if (['control', 'shift', 'alt', 'meta', 'altgraph'].includes(normalizedKey)) {
          return '';
        }

        if (code.startsWith('Key')) {
          return code.slice(3);
        }

        if (code.startsWith('Digit')) {
          return code.slice(5);
        }

        if (code.startsWith('Numpad')) {
          return code.replace('Numpad', 'Num');
        }

        if (code.startsWith('F') && /^F\d+$/.test(code)) {
          return code;
        }

        if (key.length === 1) {
          return key.toUpperCase();
        }

        return '';
      }

      function startShortcutCapture(input, statusEl, sound) {
        state.shortcutCapture = {
          input,
          statusEl,
          sound,
        };

        input.value = 'Press keys...';
        input.classList.add('shortcut-capture');
        statusEl.textContent = 'Press the shortcut keys, Esc to cancel, Backspace to clear.';
        input.focus();
        input.setSelectionRange(0, input.value.length);
      }

      function finishShortcutCapture(value, { clear = false } = {}) {
        const capture = state.shortcutCapture;
        if (!capture) {
          return;
        }

        const { input, statusEl, sound } = capture;
        state.shortcutCapture = null;
        input.classList.remove('shortcut-capture');

        if (clear) {
          input.value = '';
          statusEl.textContent = 'Shortcut cleared. Click Register to remove from memory.';
          applyShortcutToSound(sound, '');
          return;
        }

        input.value = value;
        statusEl.textContent = `Captured ${value}. Saving...`;
        applyShortcutToSound(sound, value);
      }

      function applyShortcutToSound(sound, accelerator) {
        if (window.electronAPI) {
          window.electronAPI.registerShortcut(accelerator, getSoundId(sound));
        }

        updateLibrarySound({ ...sound, shortcut: accelerator });
        renderLibrary();

        if (accelerator) {
          setStatus(`Shortcut ${accelerator} registered`);
        } else {
          setStatus('Shortcut cleared');
        }
      }

      function stopShortcutCapture() {
        const capture = state.shortcutCapture;

        if (!capture) {
          return;
        }

        capture.input.classList.remove('shortcut-capture');
        state.shortcutCapture = null;
      }

      document.addEventListener('keydown', (event) => {
        const capture = state.shortcutCapture;

        if (!capture) {
          return;
        }

        if (!getKeyNameFromEvent(event)) {
          return;
        }

        event.preventDefault();
        event.stopPropagation();

        if (event.key === 'Escape') {
          capture.input.value = capture.sound.shortcut || '';
          capture.statusEl.textContent = 'Shortcut capture cancelled.';
          stopShortcutCapture();
          return;
        }

        if (event.key === 'Backspace' || event.key === 'Delete') {
          capture.input.value = '';
          capture.statusEl.textContent = 'Shortcut cleared.';
          applyShortcutToSound(capture.sound, '');
          stopShortcutCapture();
          return;
        }

        const accelerator = formatAcceleratorFromEvent(event);

        if (!accelerator) {
          return;
        }

        capture.input.value = accelerator;
        capture.statusEl.textContent = `Captured ${accelerator}. Saving...`;
        applyShortcutToSound(capture.sound, accelerator);
        stopShortcutCapture();
      }, true);

      function updateLibrarySound(updatedSound) {
        const id = getSoundId(updatedSound);
        state.library = state.library.map((item) => (getSoundId(item) === id ? normalizeSound({ ...item, ...updatedSound }) : item));
        saveLibrary();
      }

      function removeLibrarySound(id) {
        state.library = state.library.filter((item) => getSoundId(item) !== id);
        saveLibrary();
        renderLibrary();
      }

      function bootstrapSavedShortcuts() {
        if (!window.electronAPI) return;

        state.library.forEach((sound) => {
          if (sound.shortcut) {
            window.electronAPI.registerShortcut(sound.shortcut, getSoundId(sound));
          }
        });
      }

      function toggleLibraryItem(sound) {
        const exists = state.library.some((item) => item.mp3_url === sound.mp3_url);
        if (exists) {
          state.library = state.library.filter((item) => item.mp3_url !== sound.mp3_url);
        } else {
          state.library.unshift(normalizeSound(sound));
        }
        saveLibrary();
        renderLibrary();
      }

      function formatSoundMeta(sound) {
        if (sound.localPath) {
          return `Saved locally${sound.shortcut ? ` · ${sound.shortcut}` : ''}`;
        }

        return sound.mp3_url ? new URL(sound.mp3_url).hostname.replace('www.', '') : 'Preview unavailable';
      }

      function createSoundCard(sound, { saveButton = false } = {}) {
        const template = document.getElementById('soundCardTemplate');
        const node = template.content.firstElementChild.cloneNode(true);
        node.querySelector('.title').textContent = sound.name || 'Untitled sound';
        node.querySelector('.meta').textContent = formatSoundMeta(sound);

        node.addEventListener('click', () => playSound(sound));

        const playButton = node.querySelector('.instant-button');
        if (playButton) {
          playButton.addEventListener('click', (event) => {
            event.stopPropagation();
            playSound(sound);
          });
        }

        const playIcon = node.querySelector('.playIcon');
        playIcon.innerHTML = saveButton
          ? `
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M12 4v11.2l3.6-3.6 1.4 1.4L12 19l-5-6 1.4-1.4 3.6 3.6V4z"></path>
            </svg>
          `
          : '';

        if (saveButton) {
          node.title = 'Download and add to library';
        } else {
          const actionWrap = document.createElement('div');
          actionWrap.className = 'sound-card-actions';

          const savePill = document.createElement('button');
          savePill.type = 'button';
          savePill.className = 'mi-pill mi-download';
          savePill.textContent = 'Download';
          savePill.addEventListener('click', async (event) => {
            event.stopPropagation();
            await downloadAndSave(sound);
          });

          actionWrap.appendChild(savePill);
          node.appendChild(actionWrap);
        }

        return node;
      }

      function renderSoundList(results, title = 'Search results') {
        el.resultsGrid.innerHTML = '';
        el.resultsTitle.textContent = title;
        el.resultsCount.textContent = `${results.length} result${results.length === 1 ? '' : 's'}`;
        el.emptyState.classList.toggle('hidden', results.length > 0);

        results.forEach((sound) => {
          el.resultsGrid.appendChild(createSoundCard(sound));
        });
      }

      function populateCategories(categories) {
        const currentValue = el.categorySelect.value;
        el.categorySelect.innerHTML = '<option value="">Categories</option>';

        categories.forEach((category) => {
          const option = document.createElement('option');
          option.value = category.slug;
          option.textContent = category.label;
          el.categorySelect.appendChild(option);
        });

        if (currentValue) {
          el.categorySelect.value = currentValue;
        }
      }

      async function loadTrending() {
        try {
          setStatus('Loading trending...');
          const data = window.electronAPI?.getMyInstantsTrending
            ? await window.electronAPI.getMyInstantsTrending({ countryCode: state.countryCode })
            : [];

          renderSoundList(Array.isArray(data) ? data : [], `Trending (${state.countryCode.toUpperCase()})`);
          setActiveTab('search');
          setStatus(`Loaded trending (${state.countryCode.toUpperCase()})`);
        } catch (error) {
          console.error(error);
          setStatus('Trending failed');
          renderSoundList([], 'Trending');
        }
      }

      async function loadCategory(categorySlug, categoryLabel = 'Category') {
        if (!categorySlug) {
          return;
        }

        try {
          setStatus(`Loading ${categoryLabel}...`);
          const data = window.electronAPI?.getMyInstantsCategory
            ? await window.electronAPI.getMyInstantsCategory({ categorySlug, countryCode: state.countryCode })
            : [];

          renderSoundList(Array.isArray(data) ? data : [], categoryLabel);
          setActiveTab('search');
          setStatus(`Loaded ${categoryLabel}`);
        } catch (error) {
          console.error(error);
          setStatus('Category load failed');
          renderSoundList([], categoryLabel);
        }
      }

      async function loadMyInstantsContext() {
        try {
          if (!window.electronAPI?.getMyInstantsContext) {
            el.countryBadge.textContent = 'ID';
            return;
          }

          const context = await window.electronAPI.getMyInstantsContext();
          state.countryCode = String(context?.countryCode || 'id').toLowerCase();
          state.categories = Array.isArray(context?.categories) ? context.categories : [];

          el.countryBadge.textContent = state.countryCode.toUpperCase();
          populateCategories(state.categories);
        } catch (error) {
          console.warn(error);
          el.countryBadge.textContent = 'ID';
        }
      }

      function renderLibrary() {
        el.libraryGrid.innerHTML = '';
        el.libraryEmpty.classList.toggle('hidden', state.library.length > 0);

        state.library.forEach((sound) => {
          const template = document.getElementById('libraryCardTemplate');
          const node = template.content.firstElementChild.cloneNode(true);

          node.querySelector('.libraryTitle').textContent = sound.name || 'Untitled sound';
          node.querySelector('.libraryMeta').textContent = formatSoundMeta(sound);
          node.querySelector('.libraryPlayButton').addEventListener('click', () => playSound(sound));

          const shortcutInput = node.querySelector('.shortcutInput');
          shortcutInput.value = sound.shortcut || '';
          shortcutInput.readOnly = true;
          shortcutInput.title = 'Press Record, then use the keyboard';

          const shortcutStatus = node.querySelector('.libraryStatus');
          if (sound.shortcut) {
            shortcutStatus.textContent = `Registered shortcut ${sound.shortcut}`;
          } else {
            shortcutStatus.textContent = 'Click Record, then press a shortcut.';
          }

          node.querySelector('.recordShortcutButton').addEventListener('click', () => {
            startShortcutCapture(shortcutInput, shortcutStatus, sound);
          });

          node.querySelector('.registerShortcutButton').addEventListener('click', () => {
            const accelerator = shortcutInput.value.trim();

            if (!accelerator) {
              applyShortcutToSound(sound, '');
              return;
            }

            applyShortcutToSound(sound, accelerator);
          });

          node.querySelector('.libraryDeleteButton').addEventListener('click', () => {
            // If this sound has a registered shortcut, clear it first so the global
            // shortcut is unregistered in the main process and becomes available.
            if (sound.shortcut) {
              applyShortcutToSound(sound, '');
            }

            removeLibrarySound(getSoundId(sound));
            setStatus('Removed from library');
          });

          el.libraryGrid.appendChild(node);
        });
      }

      async function downloadAndSave(sound) {
        try {
          setStatus(`Downloading ${sound.name || 'sound'}...`);
          const data = window.electronAPI?.downloadSound
            ? await window.electronAPI.downloadSound({
                url: sound.mp3_url,
                filename: sound.name,
              })
            : await (async () => {
                const response = await fetch(`${API_BASE}/download`, {
                  method: 'POST',
                  headers: {
                    'Content-Type': 'application/json',
                  },
                  body: JSON.stringify({
                    url: sound.mp3_url,
                    filename: sound.name,
                  }),
                });

                const responseData = await response.json();

                if (!response.ok) {
                  throw new Error(responseData.error || 'Download failed');
                }

                return responseData;
              })();

          const savedSound = normalizeSound({
            id: getSoundId(sound),
            name: sound.name,
            mp3_url: sound.mp3_url,
            localPath: data.saved_to,
            shortcut: sound.shortcut || '',
          });

          const exists = state.library.some((item) => getSoundId(item) === getSoundId(savedSound));
          state.library = exists
            ? state.library.map((item) => (getSoundId(item) === getSoundId(savedSound) ? savedSound : item))
            : [savedSound, ...state.library];

          saveLibrary();
          renderLibrary();
          setStatus(`Saved ${sound.name || 'sound'} to library`);
        } catch (error) {
          console.error(error);
          setStatus('Download failed');
        }
      }

      async function ensureLocalSound(sound) {
        if (sound.localPath) {
          return sound.localPath;
        }

        if (!sound.mp3_url || !window.electronAPI?.downloadSound) {
          return '';
        }

        try {
          setStatus(`Downloading ${sound.name || 'sound'}...`);
          const data = await window.electronAPI.downloadSound({
            url: sound.mp3_url,
            filename: sound.name,
          });

          if (data?.saved_to) {
            sound.localPath = data.saved_to;
            updateLibrarySound({ ...sound, localPath: data.saved_to });
            return data.saved_to;
          }
        } catch (error) {
          console.warn(error);
        }

        return '';
      }

      async function ensureSinkId() {
        if (!state.selectedSinkId) return;
        if (typeof el.audioPlayer.setSinkId !== 'function') return;

        try {
          await el.audioPlayer.setSinkId(state.selectedSinkId);
        } catch (error) {
          console.warn('Unable to set audio sink:', error);
        }
      }

      async function playSound(sound) {
        state.currentSound = sound;
        el.nowPlayingTitle.textContent = sound.name || 'Untitled sound';
        el.nowPlayingMeta.textContent = sound.localPath ? `Local file · ${sound.shortcut || 'No shortcut'}` : (sound.mp3_url || 'Missing mp3 URL');
        let source = getSoundSource(sound);

        if (!source) {
          setStatus('Missing audio source');
          return;
        }

        if (el.audioPlayer.src !== source) {
          el.audioPlayer.src = source;
        }

        el.audioPlayer.preload = 'auto';
        el.audioPlayer.currentTime = 0;
        el.audioPlayer.load();
        el.playPauseButton.disabled = false;

        await ensureSinkId();

        try {
          await el.audioPlayer.play();
          setPlaying(true);
          setStatus(`Playing ${sound.name || 'sound'}`);
        } catch (error) {
          console.warn(error);

          if (!sound.localPath && window.electronAPI?.downloadSound && sound.mp3_url) {
            const localPath = await ensureLocalSound(sound);
            if (localPath) {
              source = toFileUrl(localPath);
              el.audioPlayer.src = source;
              el.audioPlayer.load();

              try {
                await el.audioPlayer.play();
                setPlaying(true);
                setStatus(`Playing ${sound.name || 'sound'}`);
                return;
              } catch (retryError) {
                console.warn(retryError);
              }
            }
          }

          setStatus('Playback failed. Try Download first.');
        }
      }

      async function searchMyinstants() {
        const query = el.searchInput.value.trim();
        if (!query) {
          setStatus('Type a search term');
          return;
        }

        setStatus(`Searching for ${query}...`);
        el.resultsCount.textContent = 'Loading...';

        try {
          const data = window.electronAPI?.searchSounds
            ? await window.electronAPI.searchSounds(query)
            : await (async () => {
                const response = await fetch(`${API_BASE}/search?name=${encodeURIComponent(query)}`);
                const responseData = await response.json();

                if (!response.ok) {
                  throw new Error(responseData.error || 'Search failed');
                }

                return responseData;
              })();

          renderSoundList(Array.isArray(data) ? data : [], 'Search results');
          setStatus(`Loaded ${Array.isArray(data) ? data.length : 0} results`);
          setActiveTab('search');
        } catch (error) {
          console.error(error);
          setStatus('Search failed');
          renderSoundList([], 'Search results');
        }
      }

      async function refreshDevices() {
        const devices = await navigator.mediaDevices.enumerateDevices();
        const outputs = devices.filter((device) => device.kind === 'audiooutput');

        const current = el.audioOutput.value;
        el.audioOutput.innerHTML = '<option value="">Default device</option>';

        outputs.forEach((device, index) => {
          const option = document.createElement('option');
          option.value = device.deviceId;
          option.textContent = device.label || `Output ${index + 1}`;
          el.audioOutput.appendChild(option);
        });

        if (current) {
          el.audioOutput.value = current;
        }

        setStatus(outputs.length ? 'Audio outputs refreshed' : 'No output devices found');
      }

      el.tabSearch.addEventListener('click', () => setActiveTab('search'));
      el.tabLibrary.addEventListener('click', () => setActiveTab('library'));
      el.trendingButton.addEventListener('click', loadTrending);
      el.categorySelect.addEventListener('change', (event) => {
        const selectedSlug = event.target.value;
        const selectedLabel = event.target.options[event.target.selectedIndex]?.textContent || 'Category';

        if (selectedSlug) {
          loadCategory(selectedSlug, selectedLabel);
        }
      });
      el.searchButton.addEventListener('click', searchMyinstants);
      el.searchInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') searchMyinstants();
      });

      // Titlebar controls (frameless window)
      if (window.electronAPI) {
        el.winClose.addEventListener('click', () => window.electronAPI.closeWindow());
        el.winMin.addEventListener('click', () => window.electronAPI.minimizeWindow());
        el.winMax.addEventListener('click', () => window.electronAPI.toggleMaximizeWindow());

        const updateMaxButton = (isMax) => {
          el.winMax.setAttribute('data-maximized', isMax ? 'true' : 'false');
          el.winMax.title = isMax ? 'Restore' : 'Maximize';
        };

        window.electronAPI.onWindowMaximized((payload) => updateMaxButton(Boolean(payload?.maximized)));

        window.electronAPI.isWindowMaximized().then((isMax) => updateMaxButton(Boolean(isMax))).catch(() => {});
      }

      if (el.settingsButton) {
        el.settingsButton.addEventListener('click', openSettings);
      }

      if (el.settingsClose) {
        el.settingsClose.addEventListener('click', closeSettings);
      }

      if (el.settingsModal) {
        el.settingsModal.addEventListener('click', (event) => {
          if (event.target === el.settingsModal) {
            closeSettings();
          }
        });
      }

      if (el.themeButtons) {
        el.themeButtons.forEach((button) => {
          button.addEventListener('click', () => {
            applyTheme(button.dataset.theme);
          });
        });
      }

      el.refreshDevicesButton.addEventListener('click', refreshDevices);
      el.audioOutput.addEventListener('change', async (event) => {
        state.selectedSinkId = event.target.value;
        await ensureSinkId();
        setStatus(state.selectedSinkId ? 'Output device selected' : 'Using default output');
      });

      el.playPauseButton.addEventListener('click', async () => {
        if (!state.currentSound) return;
        if (el.audioPlayer.paused) {
          await el.audioPlayer.play();
          setPlaying(true);
        } else {
          el.audioPlayer.pause();
          setPlaying(false);
        }
      });

      el.audioPlayer.addEventListener('play', () => setPlaying(true));
      el.audioPlayer.addEventListener('pause', () => setPlaying(false));
      el.audioPlayer.addEventListener('ended', () => setPlaying(false));
      el.audioPlayer.volume = Number(el.volumeSlider.value) / 100;

      el.volumeSlider.addEventListener('input', (event) => {
        const value = Number(event.target.value);
        el.audioPlayer.volume = value / 100;
        el.volumeValue.textContent = `${value}%`;
      });

      if (window.electronAPI) {
        window.electronAPI.onShortcutTriggered((payload) => {
          const label = payload?.accelerator || 'shortcut';
          el.shortcutStatus.textContent = `${label} triggered${payload?.soundId ? ` for ${payload.soundId}` : ''}`;
        });

        window.electronAPI.onPlaySound((payload) => {
          if (payload?.soundId) {
            const targetSound = state.library.find((item) => getSoundId(item) === payload.soundId);

            if (targetSound) {
              playSound(targetSound);
              el.shortcutStatus.textContent = `Playing ${targetSound.name || payload.soundId}`;
            }
          }
        });

        window.electronAPI.onRegisterShortcutResponse((payload) => {
          if (!payload?.ok) {
            setStatus(payload?.error || 'Shortcut registration failed');
          }
        });
      }

      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && el.settingsModal && !el.settingsModal.classList.contains('hidden')) {
          closeSettings();
          return;
        }

        if (!state.shortcutCapture) {
          return;
        }

        const { input } = state.shortcutCapture;
        if (document.activeElement !== input) {
          return;
        }

        event.preventDefault();
        event.stopPropagation();
      }, true);

      renderLibrary();
      const storedTheme = localStorage.getItem(THEME_STORAGE_KEY) || 'light-modern';
      applyTheme(storedTheme);
      loadMyInstantsContext();
      bootstrapSavedShortcuts();
      setActiveTab('search');
      refreshDevices().catch((error) => console.warn(error));
    </script>
  </body>
</html>
